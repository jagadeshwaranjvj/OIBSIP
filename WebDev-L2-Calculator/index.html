<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Responsive JavaScript calculator">
    <title>JagCalci</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <main class="calculator-shell">
        <header class="calculator-header">
            <div>
                <span class="app-label">WEB CALCULATOR</span>
                <h1>JagCalci</h1>
            </div>

            <button id="clearAll" class="clear-key" type="button">AC</button>
        </header>

        <section class="display-panel" aria-label="Calculator display">
            <div id="expression" class="expression">&nbsp;</div>
            <output id="result" class="result" aria-live="polite">0</output>
        </section>

        <section class="keypad" aria-label="calculator keypad">
            <button class="key utility" data-action="clear">C</button>
            <button class="key utility" data-action="delete">DEL</button>
            <button class="key operator" data-operation="%">%</button>
            <button class="key operator" data-operator="/">÷</button>

            <button class="key number" data-number="7">7</button>
            <button class="key number" data-number="8">8</button>
            <button class="key number" data-number="9">9</button>
            <button class="key operator" data-operator="*">×</button>

            <button class="key number" data-number="4">4</button>
            <button class="key number" data-number="5">5</button>
            <button class="key number" data-number="6">6</button>
            <button class="key operator" data-operator="-">-</button>

            <button class="key number" data-number="1">1</button>
            <button class="key number" data-number="2">2</button>
            <button class="key number" data-number="3">3</button>
            <button class="key operator" data-operator="+">+</button>

             <button class="key number zero" data-number="0">0</button>
            <button class="key number" data-number=".">.</button>
            <button class="key equals" data-action="calculate">=</button>
            
        </section>

        <footer class="calculator-footer">
            <span>HTML</span>
            <span>CSS</span>
            <span>JavaScript</span>
        </footer>
    </main>
    <script src="./script.js"></script>
</body>
</html>
